; ============================================================================
; secrets.ini 模板 —— 复制成 secrets.ini 再填自己的值，别提交。
;
;     cp secrets.example.ini secrets.ini   # 然后改 ota_password
;
; secrets.ini 已被 .gitignore 排除；platformio.ini 顶部 [platformio] 段用
;     extra_configs = secrets.ini
; 引入它，并把它注入到两处：
;     build_flags  : -D OTA_PASSWORD=\"${secrets.ota_password}\"   （编进固件）
;     upload_flags : --auth=${secrets.ota_password}                （espota 用）
;
; 缺失时 PlatformIO 直接报 "No section: 'secrets'" 并中断构建 —— 这是故意的，
; 免得静默编出一个没有口令的固件。
;
; ⚠️ 改 ota_password 后第一次刷写必须用**旧口令**：设备校验的是它自己固件里
;    编译进去的那份，刷完新固件才换成新口令。见 docs/flashing-and-ota.md §6。
;
; 三个键都必须存在（缺任何一个 PlatformIO 都会报 "No option: 'xxx'"）：
;   ota_password —— ArduinoOTA（espota）与浏览器 /update 的口令，≥24 位随机串
;   ap_password  —— 配网热点 ORVIBO-CT30W 的密码（≥8 位）。以前硬编码成
;                   "12345678" 且进了 git，现在从本机注入。配网时手机要输它。
;   api_password —— 面板与 /api/* 的 Basic 认证口令（用户名 admin）。
;                   **留空 = 不启用鉴权**（默认）：压测 / 长稳脚本、以及任何不带
;                   凭据的自动化都还能跑。填上则打开面板要先登录 —— 长期挂 HA
;                   的那台设备建议填上。
; ============================================================================
[secrets]
ota_password = change_me_please_use_a_random_string
ap_password = change_me_at_least_8_chars
api_password =
