; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
; 本机私有凭据（OTA 口令）放在 secrets.ini —— 该文件已被 .gitignore 排除，模板见 secrets.example.ini。
; 注意：extra_configs 必须写在 [platformio] 段（写在 [env:*] 里不生效，会报 "No section: 'secrets'"）。
; 缺文件时 PlatformIO 会直接报错，不会静默编出"无口令固件"。
extra_configs = secrets.ini

[env:esp12e]
; 按本机串口填写，例如 Windows: COM4，macOS: /dev/cu.usbserial-xxx
; 也可删除本行，烧录时用: pio run -t upload --upload-port <端口>
; upload_port = COM4
; 无线刷机（ArduinoOTA 主通道）：设备在线且已是带 OTA 的固件后，用下面两种方式之一刷：
;   1) 先放开本文件下面的 upload_protocol / upload_flags（已放开），再：
;      pio run -t upload --upload-port 192.168.1.23
;      （upload_flags 里的 --auth 会被 PlatformIO 原样透传给 tools/espota.py）
; 本机私有凭据（OTA 口令）见文件顶部 [platformio] 的 extra_configs = secrets.ini
upload_protocol = espota
; upload_port = 192.168.1.23
upload_flags = --auth=${secrets.ota_password}
; 若报 "No response"，先 ping 设备 IP；若报 auth 失败，检查 secrets.ini 里的口令与设备当前固件是否一致
; （改口令后第一次刷写必须用**旧口令**——设备校验的是它自己固件里编译进去的那份，刷完才生效）。
; 串口有线刷机（接线场合）走默认值：把 upload_protocol/esptool 保持注释即可。
upload_speed = 115200
monitor_speed = 115200
monitor_filters = default
monitor_encoding = utf-8
platform = espressif8266
board = esp12e
; 实机 flash 为 2MB（Puya P25Q16，实测 manufacturer=0x5E device=0x6015）。
; esp12e 默认用的是 eagle.flash.4m1m.ld，把文件系统放在 3MB —— 2MB 芯片上只能靠
; 地址回绕（0x300000 -> 0x100000）才跑得起来。
; 这里选 eagle.flash.2m256.ld：FS 236KB @物理 0x1C0000，把 0x0~0x1C0000 全部留给
; 「当前固件 + OTA 暂存镜像」。文件系统实际只用 ~15KB，剩下的全给 OTA 换 From nothing。
; 代价：FS 位置变动 ⇒ 首次启动会自动格式化，原有 WiFi 配置/映射表清空，需要重新配网一次。
board_build.ldscript = eagle.flash.2m256.ld
framework = arduino
; 把 web/ 下的前端资源 gzip 后编进固件（生成 src/network/web_assets.h）。
; 用 pre: 前缀 = 在 PlatformIO 解析配置阶段执行，保证编译前文件已就绪；
; 网页因此跟着固件一起 OTA，改网页不需要再接线刷文件系统。
extra_scripts = pre:tools/gen_web_assets.py
lib_deps = 
    crankyoldgit/IRremoteESP8266
    knolleary/PubSubClient@^2.8
    bblanchon/ArduinoJson@^6.21.0
build_flags = 
    -D ARDUINO_ESP8266_RELEASE_2_7_4
    -Wno-sign-compare
    -D OTA_PASSWORD=\"${secrets.ota_password}\"
    -D AP_PASSWORD=\"${secrets.ap_password}\"
    -D API_PASSWORD=\"${secrets.api_password}\"
; ⚠️ 不要再加 -DPIO_FRAMEWORK_ARDUINO_LWIP2_LOW_MEMORY —— 它就是 core 的默认档，
;    framework-arduinoespressif8266/tools/platformio-build.py:244 的 else 分支即此选项，
;    加了等于没加（实机 A/B 实测固件二进制完全一致）。真要再瘦身见 TASKS.md 2.1。
